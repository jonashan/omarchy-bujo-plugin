<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace; }
    a { color: #1e66f5; } a:hover { color: #1a56d0; }
    .ground { display: flex; align-items: flex-start; justify-content: center;
              padding: 24px; background: #dce0e8; min-height: 100%; box-sizing: border-box; }
    .card { width: 360px; padding: 14px; background: #eff1f5; border: 2px solid #1e66f5;
            border-radius: 8px; box-sizing: content-box; }
    .col { display: flex; flex-direction: column; gap: 8px; width: 360px; }
    .hdr { display: flex; align-items: center; gap: 8px; height: 22px; }
    .ttl { font-size: 12px; font-weight: 700; color: #4c4f69; }
    .sep { height: 1px; background: rgba(76,79,105,0.12); }
    .sect { display: flex; align-items: baseline; justify-content: space-between;
            font-size: 10px; font-weight: 700; color: #36384b; padding-top: 2px; }
    .rows { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 9px; height: 24px; }
    .lbl { flex: 1; font-size: 12px; color: #4c4f69; min-width: 0;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .age { font-size: 10px; color: rgba(76,79,105,0.38); }
    .dim { color: rgba(76,79,105,0.38); }
    .on { color: #1e66f5; }
    .cut { text-decoration: line-through; }
    .cur { background: rgba(76,79,105,0.08); }
    .legend { display: flex; flex-wrap: wrap; gap: 11px; font-size: 10px;
              color: rgba(76,79,105,0.38); }
    .k { color: #36384b; }
    .note { font-size: 12px; color: #4c4f69; flex: 1; }
    .dot { width: 14px; display: flex; justify-content: center;
           font-size: 12px; color: rgba(76,79,105,0.38); }
  </style>
</helmet>
<div class="ground">
  <div class="card">
  <div class="col">
  <div class="hdr"><div class="ttl">Todo</div>
    <div style="flex:1"></div>
    <div class="age" style="padding-right:8px">Wed 16 Sep</div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4c4f69" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
  <div class="sep"></div>
  <div class="sect"><span>TODAY</span><span>1</span></div>
  <div class="rows">
    <div class="row cur"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#1e66f5" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"><rect x="2.5" y="2.5" width="11" height="11"/></svg><div class="lbl on">call the accountant</div><div class="age" style="color:#1e66f5"></div></div>\n    <div class="row"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="rgba(76,79,105,0.38)" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"><rect x="2.5" y="2.5" width="11" height="11"/><path d="M5.2 8.2L7.2 10.2L10.8 6.3"/></svg><div class="lbl dim">ship the invoice</div><div class="age"></div></div>\n    <div class="row"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="rgba(76,79,105,0.38)" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"><rect x="2.5" y="2.5" width="11" height="11"/><path d="M4.8 11.2L11.2 4.8"/></svg><div class="lbl dim cut">look into the Vite 6 upgrade</div><div class="age"></div></div>
  </div>
  <div class="sect"><span>DANGLING</span><span>1</span></div>
  <div class="rows">
    <div class="row"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="rgba(76,79,105,0.38)" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"><rect x="2.5" y="2.5" width="11" height="11"/></svg><div class="lbl">rewrite onboarding copy</div><div class="age" style="color:#d20f39">9d</div></div>
  </div>
  <div class="sect"><span>LOG</span><span>2</span></div>
  <div class="rows">
    <div class="row"><div class="dot">·</div><div class="note">shipped it, invoice #2043</div></div>\n    <div class="row"><div class="dot">·</div><div class="note">accountant wants the Q3 numbers by Friday</div></div>
  </div>
  <div class="sep"></div>
  <div class="legend">
    <div><span class="k">j/k</span> move</div>
    <div><span class="k">x/⏎</span> done</div>
    <div><span class="k">d</span> drop</div>
    <div><span class="k">m</span> migrate</div>
    <div><span class="k">a</span> add</div>
    <div><span class="k">n</span> note</div>
    <div><span class="k">c</span> calendar</div>
    <div><span class="k">s</span> settings</div>
  </div>
  </div>
  </div>
</div>
</x-dc>
</body>
</html>
